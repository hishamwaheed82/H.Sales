# ============================================================================
# H.Purchases - CI/CD
#
# Layout on the runner:
#   $GITHUB_WORKSPACE\H.Purchases  <- this repo
#   $GITHUB_WORKSPACE\H.Platform   <- sibling private repo (PAT checkout)
#
# Jobs:
#   build   : every push / PR -> restore, build, test (if any), publish,
#             idempotent EF migration script -> artifacts
#   migrate-db + deploy : manual "Run workflow" only
# ============================================================================
name: H.Purchases CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'doc/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: 'Skip DB migration job'
        type: boolean
        default: false

concurrency:
  group: h-purchases-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
  CONFIGURATION: Release
  SOLUTION: H.Purchases.slnx
  HOST_PROJECT: src/H.Purchases.HttpApi.Host/H.Purchases.HttpApi.Host.csproj
  EF_PROJECT: src/H.Purchases.EntityFrameworkCore
  EF_CONTEXT: PurchasesDbContext

jobs:
  build:
    name: Build, test, package
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: H.Purchases
    steps:
      - name: Checkout H.Purchases
        uses: actions/checkout@v4
        with:
          path: H.Purchases

      - name: Checkout H.Platform (private sibling repo)
        uses: actions/checkout@v4
        with:
          repository: hishamwaheed82/H.Platform
          ref: main
          path: H.Platform
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('H.Purchases/**/*.csproj', 'H.Purchases/*.props', 'H.Platform/**/*.csproj', 'H.Platform/**/*.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore $env:SOLUTION

      - name: Build
        run: dotnet build $env:SOLUTION -c $env:CONFIGURATION --no-restore

      - name: Test (only if test projects exist)
        run: |
          $tests = Get-ChildItem -Recurse -Filter *Tests*.csproj -Path test, src -ErrorAction SilentlyContinue
          if (-not $tests) { Write-Host "No test projects found - skipping."; exit 0 }
          foreach ($t in $tests) {
            dotnet test $t.FullName -c $env:CONFIGURATION --no-build --logger trx --results-directory "$env:GITHUB_WORKSPACE/test-results"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish host
        run: >
          dotnet publish $env:HOST_PROJECT -c $env:CONFIGURATION --no-build
          -o "$env:GITHUB_WORKSPACE/out/Purchases"

      - name: Sanitize publish output
        working-directory: out/Purchases
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue appsettings.Production.json, appsettings.secrets.json, appsettings.Development.json
          Get-ChildItem -Recurse -Include *.pfx | Remove-Item -Force
          if (Test-Path logs) { Remove-Item -Recurse -Force logs }
          if (Test-Path Logs) { Remove-Item -Recurse -Force Logs }
          [xml]$wc = Get-Content web.config
          $anc = $wc.SelectSingleNode('//aspNetCore')
          $anc.SetAttribute('hostingModel', 'inprocess')
          $anc.SetAttribute('stdoutLogEnabled', 'false')
          $anc.SetAttribute('stdoutLogFile', '.\logs\stdout')
          $envs = $anc.SelectSingleNode('environmentVariables')
          if (-not $envs) { $envs = $wc.CreateElement('environmentVariables'); [void]$anc.AppendChild($envs) }
          $ev = $envs.SelectSingleNode("environmentVariable[@name='ASPNETCORE_ENVIRONMENT']")
          if (-not $ev) { $ev = $wc.CreateElement('environmentVariable'); $ev.SetAttribute('name','ASPNETCORE_ENVIRONMENT'); [void]$envs.AppendChild($ev) }
          $ev.SetAttribute('value', 'Production')
          $ws = $anc.ParentNode
          $mods = $ws.SelectSingleNode('modules')
          if (-not $mods) { $mods = $wc.CreateElement('modules'); [void]$ws.PrependChild($mods) }
          if (-not $mods.SelectSingleNode("remove[@name='WebDAVModule']")) { $r = $wc.CreateElement('remove'); $r.SetAttribute('name','WebDAVModule'); [void]$mods.PrependChild($r) }
          $hnd = $ws.SelectSingleNode('handlers')
          if (-not $hnd.SelectSingleNode("remove[@name='WebDAV']")) { $r = $wc.CreateElement('remove'); $r.SetAttribute('name','WebDAV'); [void]$hnd.PrependChild($r) }
          if (-not $hnd.SelectSingleNode("add[@name='aspNetCore']")) { throw "aspNetCore handler missing from web.config" }
          $wc.Save((Resolve-Path web.config))
          Get-Content web.config

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.*

      - name: Generate idempotent migration script (no DB connection)
        run: >
          dotnet ef migrations script --idempotent
          --configuration $env:CONFIGURATION --no-build
          --project $env:EF_PROJECT --startup-project $env:EF_PROJECT
          --context $env:EF_CONTEXT
          --output "$env:GITHUB_WORKSPACE/out/sql/Purchases-migrations.sql"

      - name: Apply with sqlcmd
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.skip_migrations
        env:
          SQL_SERVER: ${{ secrets.PU_SQL_SERVER }}
          SQL_DATABASE: ${{ secrets.PU_SQL_DATABASE }}
          SQL_USER: ${{ secrets.PU_SQL_USER }}
          SQLCMDPASSWORD: ${{ secrets.PU_SQL_PASSWORD }}
        run: |
          sqlcmd -S $env:SQL_SERVER -d $env:SQL_DATABASE -U $env:SQL_USER -C -b -l 30 -I -i "$env:GITHUB_WORKSPACE/out/sql/Purchases-migrations.sql"
          if ($LASTEXITCODE -ne 0) { throw "sqlcmd failed ($LASTEXITCODE)" }
        shell: pwsh
        working-directory: ${{ github.workspace }}

      - name: Stage Purchases-app
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: New-Item -ItemType Directory -Force 'app' | Out-Null; Copy-Item -Recurse -Force 'out/Purchases/*' 'app'

      - name: Generate appsettings.Production.json from secrets
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          PU_SQL_DATABASE: ${{ secrets.PU_SQL_DATABASE }}
          PU_SQL_USER: ${{ secrets.PU_SQL_USER }}
          PU_SQL_PASSWORD: ${{ secrets.PU_SQL_PASSWORD }}
          SHARED_SQL_DATABASE: ${{ secrets.SHARED_SQL_DATABASE }}
          SHARED_SQL_USER: ${{ secrets.SHARED_SQL_USER }}
          SHARED_SQL_PASSWORD: ${{ secrets.SHARED_SQL_PASSWORD }}
          STRING_PASSPHRASE: ${{ secrets.PU_STRING_ENCRYPTION_PASSPHRASE }}
        run: |
          $pu     = "Server=.;Database=$env:PU_SQL_DATABASE;User Id=$env:PU_SQL_USER;Password=$env:PU_SQL_PASSWORD;TrustServerCertificate=True;Encrypt=True"
          $shared = "Server=.;Database=$env:SHARED_SQL_DATABASE;User Id=$env:SHARED_SQL_USER;Password=$env:SHARED_SQL_PASSWORD;TrustServerCertificate=True;Encrypt=True"
          $cfg = [ordered]@{
            App = [ordered]@{
              SelfUrl     = 'https://purchases-api.soft-planning.com'
              CorsOrigins = 'https://purchases.soft-planning.com'
            }
            AuthServer = [ordered]@{
              Authority            = 'https://auth.soft-planning.com'
              Audience             = 'H.Purchases'
              RequireHttpsMetadata = $true
            }
            ConnectionStrings = [ordered]@{
              Purchases               = $pu
              Platform                = $shared
              AbpPermissionManagement = $shared
              AbpSettingManagement    = $shared
              AbpFeatureManagement    = $shared
              AbpTenantManagement     = $shared
              AbpIdentity             = $shared
            }
            StringEncryption = [ordered]@{
              DefaultPassPhrase = $env:STRING_PASSPHRASE
            }
          }
          $cfg | ConvertTo-Json -Depth 5 | Set-Content -Path app/appsettings.Production.json -Encoding utf8
          "Generated appsettings.Production.json ($((Get-Item app/appsettings.Production.json).Length) bytes)"
        shell: pwsh
        working-directory: ${{ github.workspace }}

      - name: Web Deploy (msdeploy)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          WD_SERVER: ${{ secrets.WEBDEPLOY_SERVER }}
          WD_SITE: ${{ secrets.PU_WEBDEPLOY_SITE }}
          WD_USER: ${{ secrets.WEBDEPLOY_USERNAME }}
          WD_PASSWORD: ${{ secrets.WEBDEPLOY_PASSWORD }}
        run: |
          $msdeploy = "${env:ProgramFiles}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          if (-not (Test-Path $msdeploy)) { choco install webdeploy -y --no-progress; }
          if (-not (Test-Path $msdeploy)) { throw "msdeploy.exe not found" }
          $src = (Resolve-Path app).Path
          $msArgs = @(
            '-verb:sync',
            "-source:contentPath=$src",
            "-dest:contentPath=$env:WD_SITE,computerName=https://${env:WD_SERVER}:8172/msdeploy.axd?site=$env:WD_SITE,userName=$env:WD_USER,password=$env:WD_PASSWORD,authType=Basic",
            '-allowUntrusted',
            '-enableRule:AppOffline',
            '-enableRule:DoNotDeleteRule',
            '-skip:objectName=filePath,absolutePath=appsettings\.secrets\.json$',
            '-skip:objectName=filePath,absolutePath=\.pfx$',
            '-skip:objectName=dirPath,absolutePath=\\logs$',
            '-skip:objectName=dirPath,absolutePath=\\Logs$',
            '-skip:objectName=dirPath,absolutePath=\\wwwroot\\uploads$',
            '-retryAttempts:3', '-retryInterval:3000'
          )
          & $msdeploy @msArgs 2>&1 | ForEach-Object { "$_".Replace($env:WD_PASSWORD, '***') }
          if ($LASTEXITCODE -ne 0) { throw "msdeploy failed ($LASTEXITCODE)" }
        shell: pwsh
        working-directory: ${{ github.workspace }}

      - name: Smoke test /swagger
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          SITE_URL: https://purchases-api.soft-planning.com
        run: |
          Start-Sleep -Seconds 15
          for ($i = 1; $i -le 10; $i++) {
            $code = curl.exe -s -o NUL -w "%{http_code}" --max-time 30 "$env:SITE_URL/swagger/v1/swagger.json"
            Write-Host "Attempt ${i}: HTTP $code"
            if ($code -eq '200') { exit 0 }
            Start-Sleep -Seconds 10
          }
          throw "Smoke test failed: /swagger did not return 200"
        shell: pwsh
        working-directory: ${{ github.workspace }}
    environment: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && 'production' || '' }}
